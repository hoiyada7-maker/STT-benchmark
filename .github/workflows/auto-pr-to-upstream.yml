name: Auto PR to upstream

# 포크 저장소에서 feature/* 브랜치를 push 하면 업스트림(원본) 레포로 PR을 자동 생성/갱신한다.
#
# 동작 조건:
#   1) 이 워크플로우가 '포크'에서 실행될 것 — 업스트림(hoiyada7-maker/STT-benchmark)
#      자체에서는 건너뛴다(job-level if).
#   2) 포크 소유자가 Secrets 에 UPSTREAM_PAT 를 등록해 둘 것. 미등록 시 경고만
#      남기고 건너뛴다.
#
# UPSTREAM_PAT 설정법(포크 소유자):
#   1) GitHub → Settings → Developer settings → Personal access tokens 에서
#      `repo` + `workflow` 스코프를 가진 Fine-grained PAT 를 발급한다
#      (업스트림 레포에 PR을 열 수 있는 계정의 토큰).
#   2) 포크 레포 → Settings → Secrets and variables → Actions 에서
#      이름 `UPSTREAM_PAT`, 값 = 위 토큰 으로 저장한다.
#
# 같은 feature/* 브랜치에 재-push 하면 새 PR을 만들지 않고 기존 열린 PR을 갱신한다.

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-pr:
    # 업스트림 저장소 자체에서는 실행하지 않는다(포크에서만).
    if: github.repository != 'hoiyada7-maker/STT-benchmark'
    runs-on: ubuntu-latest
    steps:
      - name: Check UPSTREAM_PAT
        id: check
        env:
          PAT: ${{ secrets.UPSTREAM_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::이 포크에 UPSTREAM_PAT 시크릿이 없어 자동 PR을 건너뜁니다."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update upstream PR
        if: steps.check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PAT }}
          UPSTREAM_REPO: hoiyada7-maker/STT-benchmark
          HEAD: ${{ github.repository_owner }}:${{ github.ref_name }}
          TITLE: ${{ github.ref_name }} — auto PR from ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          body="Automated PR from fork ${{ github.repository }} branch ${{ github.ref_name }}."
          existing="$(gh pr list --repo "$UPSTREAM_REPO" --head "$HEAD" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$UPSTREAM_REPO" --title "$TITLE" --body "$body"
            echo "Updated existing PR #$existing"
          else
            gh pr create --repo "$UPSTREAM_REPO" --base main --head "$HEAD" --title "$TITLE" --body "$body"
            echo "Created new PR"
          fi
